      .label { font-family: Arial, sans-serif; font-size: 15px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .shape { fill: #fff; stroke: #111; stroke-width: 2; }
      .panel { fill: #fff; stroke: #111; stroke-width: 1.5; }
      .line { fill: none; stroke: #111; stroke-width: 2; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #111; stroke-width: 2; }
